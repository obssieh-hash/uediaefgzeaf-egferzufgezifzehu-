<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVAS Console</title>
    <meta name="description" content="Console web moderne pour le scanner de vulnérabilités OpenVAS (openvasd)." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      try {
        const t = localStorage.getItem("ovc.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard">
          <img src="favicon.svg" alt="" width="34" height="34" />
          <span>
            <strong>OpenVAS</strong>
            <small>Console du scanner</small>
          </span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="conn"></div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menu" aria-label="Menu"></button>
          <div class="crumbs" id="crumbs"></div>
          <button class="search-trigger" id="palette-open">
            <span class="si"></span>
            <span class="grow">Rechercher un scan, une page…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="icon-btn" id="theme" aria-label="Changer de thème"></button>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="overlay"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
