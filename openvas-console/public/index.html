<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentrovyx</title>
    <meta name="description" content="Sentrovyx — gestion des vulnérabilités pour les équipes SSI, propulsée par le scanner OpenVAS." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      try {
        const t = localStorage.getItem("ovc.theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/dashboard" aria-label="Sentrovyx — tableau de bord">
          <img class="brand-icon" src="brand/sentrovyx-icon.svg" alt="" width="26" height="34" />
          <span class="brand-text">
            <img class="wordmark wm-light" src="brand/sentrovyx-wordmark.png" alt="Sentrovyx" height="22" />
            <img class="wordmark wm-dark" src="brand/sentrovyx-wordmark-dark.png" alt="Sentrovyx" height="22" />
            <small>Gestion des vulnérabilités</small>
          </span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="conn"></div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menu" aria-label="Menu"></button>
          <div class="crumbs" id="crumbs"></div>
          <button class="search-trigger" id="palette-open">
            <span class="si"></span>
            <span class="grow">Rechercher un scan, une page…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <span id="openwarn"></span>
          <button class="icon-btn" id="bell" aria-label="Notifications"></button>
          <button class="icon-btn" id="theme" aria-label="Changer de thème"></button>
          <button class="user-btn" id="user" aria-label="Mon compte"></button>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="overlay"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
