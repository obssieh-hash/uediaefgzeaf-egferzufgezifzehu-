# Déploiement complet : openvasd (openvas-scanner) + interface web.
#
# Tout est isolé sous le nom de projet « openvas-console » : conteneurs,
# réseau et volumes portent ce préfixe et ne touchent à aucun autre projet
# Docker du serveur. openvasd n'est publié sur aucun port de l'hôte ; seule
# l'interface l'est, sur 127.0.0.1 par défaut.
name: openvas-console

x-openvas-image: &openvas-image ${OPENVAS_IMAGE:-ghcr.io/greenbone/openvas-scanner:stable}

services:
  # --- Données du flux (copiées dans les volumes puis le conteneur s'arrête) ---
  vulnerability-tests:
    image: ${VT_IMAGE:-registry.community.greenbone.net/community/vulnerability-tests}
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: ${NOTUS_IMAGE:-registry.community.greenbone.net/community/notus-data}
    volumes:
      - notus_data_vol:/mnt

  gpg-data:
    image: ${GPG_IMAGE:-registry.community.greenbone.net/community/gpg-data}
    volumes:
      - gpg_data_vol:/mnt

  # --- Scanner ---
  redis-server:
    image: ${REDIS_IMAGE:-ghcr.io/greenbone/redis-server}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-0}
    volumes:
      - redis_socket_vol:/run/redis/

  configure-openvas-log:
    image: *openvas-image
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    environment:
      OPENVAS_LOG_LEVEL: ${OPENVAS_LOG_LEVEL:-64}
    command:
      - /bin/sh
      - -c
      - |
        sed "s/127/$$OPENVAS_LOG_LEVEL/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  configure-openvas:
    image: *openvas-image
    volumes:
      - openvas_data_vol:/mnt
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:3000\n" > /mnt/openvas.conf
        chmod 644 /mnt/openvas.conf

  openvasd:
    image: *openvas-image
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENVASD_MEMORY_LIMIT:-0}
          cpus: ${OPENVASD_CPUS:-0}
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      SCANNER_TYPE: openvas
      GNUPGHOME: /etc/openvas/gnupg
      XDG_CACHE_HOME: /var/cache/
      STORAGE_TYPE: fs
      LISTENING: 0.0.0.0:3000
      OPENVASD_LOG: INFO
      API_KEY: ${OPENVASD_API_KEY:?Définissez OPENVASD_API_KEY dans le fichier .env}
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
      - vt_data_vol:/var/lib/openvas/plugins
      - redis_socket_vol:/run/redis/
      - openvasd_cache_vol:/var/cache/
    # Aucun « ports: » : openvasd n'est joignable que depuis ce projet.
    depends_on:
      vulnerability-tests:
        condition: service_completed_successfully
      notus-data:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
      configure-openvas-log:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      redis-server:
        condition: service_started

  # --- Interface web ---
  openvas-ui:
    build: ..
    image: openvas-console-ui:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      OPENVASD_URL: http://openvasd:3000
      OPENVASD_API_KEY: ${OPENVASD_API_KEY}
      UI_ADMIN_USER: ${UI_ADMIN_USER:-admin}
      UI_ADMIN_PASSWORD: ${UI_ADMIN_PASSWORD:-}
      UI_VIEWER_USER: ${UI_VIEWER_USER:-lecteur}
      UI_VIEWER_PASSWORD: ${UI_VIEWER_PASSWORD:-}
    volumes:
      - ui_data_vol:/data
    ports:
      - ${UI_BIND_ADDRESS:-127.0.0.1:8090}:8080
    depends_on:
      - openvasd

volumes:
  gpg_data_vol:
  vt_data_vol:
  notus_data_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  openvasd_cache_vol:
  ui_data_vol:
